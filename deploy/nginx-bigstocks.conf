# Nginx in front of the BigStocks site on the Droplet.
#
#   sudo cp deploy/nginx-bigstocks.conf /etc/nginx/sites-available/bigstocks
#   sudo ln -sf /etc/nginx/sites-available/bigstocks /etc/nginx/sites-enabled/bigstocks
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bigstocks.com -d www.bigstocks.com -d data.bigstocks.com
#
# Certbot adds the HTTPS parts and renews the certificates by itself. Change the names below if your
# domain differs. The site itself listens only on 127.0.0.1:3000 (see ecosystem.config.cjs).

# www and the old data address answer with a redirect to the main address, keeping the path, so
# links in emails already sent keep working.
server {
    listen 80;
    listen [::]:80;
    server_name www.bigstocks.com data.bigstocks.com;
    return 301 https://bigstocks.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name bigstocks.com;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The site reads the visitor's address from here (rate limits, consent records).
        # $remote_addr, not anything the visitor sent, so it cannot be faked.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built files never change once published: let browsers keep them.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
